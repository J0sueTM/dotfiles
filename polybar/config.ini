; ~/.config/polybar/config.ini
; Ubuntu-style top bar: workspaces left, clock center, system icons right.

[colors]
bg      = #0b0e0d
surface = #141918
border  = #2a3331
muted   = #6f7d78
fg      = #dfe3dc
gold    = #e6b450
teal    = #5fb3a1
green   = #9ccf7f
red     = #e5675f

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 14px
padding-right = 10px
module-margin = 7px

; 0 text  1 bold text (clock)  2 icons  3 workspace pills (proportional glyphs)
font-0 = "Mononoki Nerd Font:size=10;3"
font-1 = "Mononoki Nerd Font:style=Bold:size=10;3"
font-2 = "Mononoki Nerd Font:size=13;3"
font-3 = "Mononoki Nerd Font Propo:size=7;1"

modules-left = i3
modules-center = date
modules-right = tray xkeyboard wlan pulseaudio battery power

wm-restack = i3
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; other monitors: same bar, no tray (only one tray can exist)
[bar/secondary]
inherit = bar/main
modules-right = xkeyboard wlan pulseaudio battery power

; ---------------------------------------------------------------- left

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false
format = <label-state><label-mode>

; GNOME-style indicator: active workspace is a long pill, others are dots
label-focused = %{T4}████%{T-}
label-focused-foreground = ${colors.gold}
label-focused-padding = 3px

label-visible = %{T4}%{T-}
label-visible-foreground = ${colors.teal}
label-visible-padding = 3px

label-unfocused = %{T4}%{T-}
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 3px

label-urgent = %{T4}%{T-}
label-urgent-foreground = ${colors.red}
label-urgent-padding = 3px

; resize / mouse mode
label-mode = %mode%
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.gold}
label-mode-padding = 8px
label-mode-margin-left = 10px

; ---------------------------------------------------------------- center

[module/date]
type = internal/date
interval = 1
date = %a %b %-d
time = %H:%M
date-alt = %A, %-d %B %Y
time-alt = %H:%M:%S
label = %date%   %time%
label-font = 2

; ---------------------------------------------------------------- right

[module/tray]
type = internal/tray
tray-size = 55%
tray-spacing = 8px

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
layout-icon-0 = us;dvp;dvp
layout-icon-1 = br;dvorak;br·dv
layout-icon-2 = br;br
layout-icon-default = kb
label-layout = %icon%
label-layout-foreground = ${colors.muted}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:~/.config/i3/scripts/wifi.sh &:}<ramp-signal>%{A}
format-disconnected = %{A1:~/.config/i3/scripts/wifi.sh &:}<label-disconnected>%{A}
label-disconnected = %{T3}󰤮%{T-}
label-disconnected-foreground = ${colors.muted}
ramp-signal-0 = %{T3}󰤯%{T-}
ramp-signal-1 = %{T3}󰤟%{T-}
ramp-signal-2 = %{T3}󰤢%{T-}
ramp-signal-3 = %{T3}󰤥%{T-}
ramp-signal-4 = %{T3}󰤨%{T-}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume>
ramp-volume-0 = %{T3}󰕿%{T-}
ramp-volume-1 = %{T3}󰖀%{T-}
ramp-volume-2 = %{T3}󰕾%{T-}
label-muted = %{T3}󰝟%{T-}
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.red}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%

ramp-capacity-0 = %{T3}󰁺%{T-}
ramp-capacity-1 = %{T3}󰁼%{T-}
ramp-capacity-2 = %{T3}󰁾%{T-}
ramp-capacity-3 = %{T3}󰂀%{T-}
ramp-capacity-4 = %{T3}󰂂%{T-}
ramp-capacity-5 = %{T3}󰁹%{T-}

animation-charging-0 = %{T3}󰢜%{T-}
animation-charging-1 = %{T3}󰂇%{T-}
animation-charging-2 = %{T3}󰢝%{T-}
animation-charging-3 = %{T3}󰂉%{T-}
animation-charging-4 = %{T3}󰂅%{T-}
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 900

[module/power]
type = custom/text
format = %{T3}󰐥%{T-}
format-foreground = ${colors.gold}
format-padding = 4px
click-left = ~/.config/i3/scripts/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
