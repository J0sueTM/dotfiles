; ~/.config/polybar/config.ini
; Ubuntu-style top bar: workspaces left, clock center, system icons right.

[colors]
bg      = #0b0e0d
surface = #141918
border  = #2a3331
muted   = #6f7d78
fg      = #dfe3dc
gold    = #e6b450
teal    = #5fb3a1
green   = #9ccf7f
red     = #e5675f

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 14px
padding-right = 10px
module-margin = 7px

; the notch over the focused workspace
line-size = 2

; 0 text  1 bold text (clock, focused workspace)  2 icons
font-0 = "Mononoki Nerd Font:size=10;3"
font-1 = "Mononoki Nerd Font:style=Bold:size=10;3"
font-2 = "Mononoki Nerd Font:size=13;3"

modules-left = workspaces tabs
modules-center = date
modules-right = tray xkeyboard wlan pulseaudio battery power

wm-restack = i3
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; other monitors: same bar, no tray (only one tray can exist)
[bar/secondary]
inherit = bar/main
modules-right = xkeyboard wlan pulseaudio battery power

; ---------------------------------------------------------------- left

[module/workspaces]
type = custom/script
exec = ~/.config/i3/scripts/workspaces.sh
tail = true
format = <label>
label = %output%

; tabs of the focused tabbed/stacked container (i3 draws none, see picom.conf)
[module/tabs]
type = custom/script
exec = ~/.config/i3/scripts/tabs.sh
tail = true
format = <label>
label = %output%

; ---------------------------------------------------------------- center

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
date-alt = %A, %d %B %Y
time-alt = %H:%M:%S
label = %date%   %time%
label-font = 2

; ---------------------------------------------------------------- right

[module/tray]
type = internal/tray
tray-size = 55%
tray-spacing = 8px

[module/xkeyboard]
type = custom/script
exec = ~/.config/i3/scripts/kbd.sh
interval = 1
format-foreground = ${colors.muted}
click-left = ~/.config/i3/scripts/kbd.sh next

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:~/.config/i3/scripts/wifi.sh &:}<ramp-signal>%{A}
format-disconnected = %{A1:~/.config/i3/scripts/wifi.sh &:}<label-disconnected>%{A}
label-disconnected = %{T3}󰤮%{T-}
label-disconnected-foreground = ${colors.muted}
ramp-signal-0 = %{T3}󰤯%{T-}
ramp-signal-1 = %{T3}󰤟%{T-}
ramp-signal-2 = %{T3}󰤢%{T-}
ramp-signal-3 = %{T3}󰤥%{T-}
ramp-signal-4 = %{T3}󰤨%{T-}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume>
ramp-volume-0 = %{T3}󰕿%{T-}
ramp-volume-1 = %{T3}󰖀%{T-}
ramp-volume-2 = %{T3}󰕾%{T-}
label-muted = %{T3}󰝟%{T-}
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.red}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%

ramp-capacity-0 = %{T3}󰁺%{T-}
ramp-capacity-1 = %{T3}󰁼%{T-}
ramp-capacity-2 = %{T3}󰁾%{T-}
ramp-capacity-3 = %{T3}󰂀%{T-}
ramp-capacity-4 = %{T3}󰂂%{T-}
ramp-capacity-5 = %{T3}󰁹%{T-}

animation-charging-0 = %{T3}󰢜%{T-}
animation-charging-1 = %{T3}󰂇%{T-}
animation-charging-2 = %{T3}󰢝%{T-}
animation-charging-3 = %{T3}󰂉%{T-}
animation-charging-4 = %{T3}󰂅%{T-}
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 900

[module/power]
type = custom/text
format = %{T3}󰐥%{T-}
format-foreground = ${colors.gold}
format-padding = 4px
click-left = ~/.config/i3/scripts/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
