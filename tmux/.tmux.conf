# .tmux.conf
# Josue Teodoro Moreira <jteodomo@gmail.com>
# December 14, 2020

# new prefix
set -g prefix C-t
unbind C-b
bind C-t send-prefix

# pane movement for dvorak
bind h select-pane -L
bind t select-pane -D
bind n select-pane -U
bind s select-pane -R

# --- Claude Code sessions: bell alerts, jump key, tab names ---
# Flag windows whose pane rang the bell (Claude hooks ring it)
set -g monitor-bell on
set -g bell-action any          # pass the bell to alacritty -> i3 marks the workspace urgent
set -g visual-bell off
set -g window-status-bell-style 'fg=black,bg=yellow,bold'

# prefix + a: jump to the next window that rang the bell (a Claude waiting on you)
bind a next-window -a

# Name tabs after the folder they're in, with the Claude state mark in front
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g window-status-format '#I:#{@claude}#{?@claude_title,#{=/20/…:@claude_title},#W}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#{@claude}#{?@claude_title,#{=/20/…:@claude_title},#W}#{?window_flags,#{window_flags}, }'
