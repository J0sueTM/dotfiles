# Older setup, switched off: uncomment to get the Ctrl+t prefix and dvorak pane keys back
#   new prefix
# set -g prefix C-t
# unbind C-b
# bind C-t send-prefix
#
#   pane movement for dvorak
# bind h select-pane -L
# bind t select-pane -D
# bind n select-pane -U
# bind s select-pane -R

# Claude Code sessions: alerts, jump key, tab names and state

# A session that needs you rings its pane's bell (claude/hooks/notify.sh):
# the tab is flagged here, and alacritty passes it on so i3 marks the workspace urgent
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# prefix + a: jump to the next tab that rang
bind a next-window -a

# Claude Code drops to 256 colors under tmux unless told the terminal does truecolor
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Tabs are named after their folder, or after the Claude session running in them
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# The terminal's window title is the Claude state and session name, so i3 / polybar
# tab lists show which terminal is which (and which one is waiting)
set -g set-titles on
set -g set-titles-string '#{?#{==:#{@claude},working},  ,#{?#{==:#{@claude},waiting},  ,#{?#{==:#{@claude},ask},  ,}}}#{?@claude_title,#{@claude_title},#W}'

# --- Look: the i3 palette -----------------------------------------------------
# Defined once in theme/palette.sh; used below as #{@theme_gold} and so on.
# >>> theme colours: generated from theme/palette.sh by ./install theme
set -g @theme_bg     '#0b0e0d'
set -g @theme_raised '#1f2726'
set -g @theme_border '#2a3331'
set -g @theme_muted  '#6f7d78'
set -g @theme_fg     '#dfe3dc'
set -g @theme_gold   '#e6b450'
set -g @theme_teal   '#5fb3a1'
set -g @theme_red    '#e5675f'
# <<< theme colours
set -gF status-style 'bg=default,fg=#{@theme_muted}'
set -g status-left-length 30
set -g status-right-length 40
# The session's name as a gold pill, unless it is one of tmux's automatic numbers
set -g status-left '#{?#{m/r:^[0-9]+$,#S},,#[fg=#{@theme_gold}]#[bg=#{@theme_gold}]#[fg=#{@theme_bg}]#[bold]#S#[nobold]#[bg=default]#[fg=#{@theme_gold}] }'
set -g status-right '#{?client_prefix,#[fg=#{@theme_gold}] prefix  ,}#{?pane_in_mode,#[fg=#{@theme_teal}]copy  ,}#[fg=#{@theme_muted}]%H:%M '
set -g window-status-separator ''
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-bell-style default
set -g window-status-activity-style default

# Each tab: number, Claude state ( working,  waiting for you,  needs approval), name
set -g window-status-format '#[fg=#{@theme_muted}] #I #{?#{==:#{@claude},working},#[fg=#{@theme_gold}]  ,#{?#{==:#{@claude},waiting},#[fg=#{@theme_teal}]  ,#{?#{==:#{@claude},ask},#[fg=#{@theme_red}]  ,}}}#{?window_bell_flag,#[fg=#{@theme_gold}],#[fg=#{@theme_muted}]}#{?@claude_title,#{=/22/…:@claude_title},#W}#{?window_bell_flag, ,} '
set -g window-status-current-format '#[fg=#{@theme_raised}]#[bg=#{@theme_raised}]#[fg=#{@theme_gold}]#I #{?#{==:#{@claude},working},#[fg=#{@theme_gold}]  ,#{?#{==:#{@claude},waiting},#[fg=#{@theme_teal}]  ,#{?#{==:#{@claude},ask},#[fg=#{@theme_red}]  ,}}}#[fg=#{@theme_fg}]#[bold]#{?@claude_title,#{=/22/…:@claude_title},#W}#[nobold]#[bg=default]#[fg=#{@theme_raised}]'

set -gF pane-border-style 'fg=#{@theme_border}'
set -gF pane-active-border-style 'fg=#{@theme_gold}'
set -gF message-style 'bg=#{@theme_raised},fg=#{@theme_gold}'
set -gF message-command-style 'bg=#{@theme_raised},fg=#{@theme_fg}'
set -gF mode-style 'bg=#{@theme_border},fg=#{@theme_fg}'
set -gF clock-mode-colour '#{@theme_gold}'

# One blank row between the terminal's content and the tab bar: the bar is two
# rows tall, the first empty, the second tmux's stock bar layout (its default
# status-format[0], unchanged: it draws status-left, the tabs and status-right)
set -g status 2
set -g status-format[0] ''
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
