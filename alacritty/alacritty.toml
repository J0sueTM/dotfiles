# ~/.config/alacritty/alacritty.toml
# palette "forest night" (matches i3, polybar, rofi, dunst)

[window]
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "None"
opacity = 0.94

[font]
size = 11.0
normal = { family = "Mononoki Nerd Font", style = "Regular" }
bold = { family = "Mononoki Nerd Font", style = "Bold" }
italic = { family = "Mononoki Nerd Font", style = "Italic" }
bold_italic = { family = "Mononoki Nerd Font", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[colors.primary]
background = "#0f1312"
foreground = "#dfe3dc"
dim_foreground = "#9aa6a1"
bright_foreground = "#eef1ea"

[colors.cursor]
text = "#0f1312"
cursor = "#e6b450"

[colors.vi_mode_cursor]
text = "#0f1312"
cursor = "#5fb3a1"

[colors.selection]
text = "CellForeground"
background = "#2a3331"

[colors.search.matches]
foreground = "#0f1312"
background = "#5fb3a1"

[colors.search.focused_match]
foreground = "#0f1312"
background = "#e6b450"

[colors.footer_bar]
foreground = "#dfe3dc"
background = "#1d2423"

[colors.hints.start]
foreground = "#0f1312"
background = "#e6b450"

[colors.hints.end]
foreground = "#0f1312"
background = "#9aa6a1"

[colors.normal]
black = "#1d2423"
red = "#e5675f"
green = "#9ccf7f"
yellow = "#e6b450"
blue = "#74a7d1"
magenta = "#c59ad6"
cyan = "#5fb3a1"
white = "#c7ccc4"

[colors.bright]
black = "#4a5653"
red = "#f08a82"
green = "#b5e09b"
yellow = "#f2cc7a"
blue = "#96bfe2"
magenta = "#d6b4e3"
cyan = "#85cbbd"
white = "#eef1ea"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
