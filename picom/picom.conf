# ~/.config/picom/picom.conf (picom 12)

backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = true;   # fullscreen games/video bypass the compositor

# rounded corners
corner-radius = 10;

# soft shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-color = "#000000";

# quick fades
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# frosted glass behind translucent windows (terminal, rofi, dunst)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

rules = (
  # the bar is a flat strip, like ubuntu's
  { match = "window_type = 'dock'"; corner-radius = 0; shadow = false; blur-background = false; },
  { match = "window_type = 'desktop'"; corner-radius = 0; shadow = false; blur-background = false; },

  # screenshot selection, browser/app menus and tooltips: leave alone
  { match = "class_g = 'maim' || class_g = 'slop'"; shadow = false; blur-background = false; fade = false; },
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'menu'"; corner-radius = 6; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },

  # i3's tab row (tabbed/stacked containers): invisible, the tabs live in
  # polybar. Container frames are named "[i3 con] ...", the tab row has no name.
  { match = "class_g = 'i3-frame' && name !*= 'i3 con'"; opacity = 0; shadow = false; blur-background = false; corner-radius = 0; fade = false; },

  # fullscreen windows stay square
  { match = "fullscreen"; corner-radius = 0; },

  { match = "class_g = 'Rofi'"; corner-radius = 14; },
  { match = "class_g = 'Dunst'"; corner-radius = 10; },
);
